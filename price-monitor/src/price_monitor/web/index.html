<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#0d0b51">
    <title>Overview · Price Monitor</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%230d0b51'/%3E%3Ctext x='16' y='20' text-anchor='middle' font-family='system-ui,sans-serif' font-size='10' font-weight='800' fill='white'%3EPM%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="/static/price-monitor/app.css">
    <script defer src="/static/price-monitor/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Workspace navigation">
        <div class="sidebar-top">
          <a class="brand" href="/" data-nav aria-label="Price Monitor overview">
            <span class="brand-mark" aria-hidden="true">PM</span>
            <span>Price Monitor</span>
          </a>
        </div>
        <label class="workspace-control" for="workspace-select">
          <span class="sidebar-label">Workspace</span>
          <select id="workspace-select" aria-label="Workspace" disabled>
            <option>Loading workspace</option>
          </select>
        </label>
        <a class="sidebar-create" href="/products/new" data-nav data-add-product hidden>
          <span class="create-full">Add product</span>
          <span class="create-short">Add</span>
        </a>
        <nav class="primary-nav" aria-label="Primary navigation">
          <a href="/" data-nav data-route="overview">Overview</a>
          <a href="/products" data-nav data-route="products">Products</a>
          <a href="/competitors" data-nav data-route="competitors">Competitors</a>
          <a href="/alerts" data-nav data-route="alerts">Alerts</a>
        </nav>
        <div class="sidebar-footer">
          <span class="service-pill is-checking" id="service-status" role="status" aria-label="Checking service">
            <span class="status-dot" aria-hidden="true"></span>
            <span>Checking</span>
          </span>
          <button class="button small" id="session-logout" type="button" hidden>Sign out</button>
        </div>
      </aside>

      <div class="app-frame">
        <header class="utility-bar">
          <div class="utility-inner">
            <span class="utility-context" id="utility-context">Overview</span>
          </div>
        </header>

        <main class="shell main-content" id="main-content" tabindex="-1">
          <div class="loading-state" role="status" aria-live="polite">
            <h1>Loading prices</h1>
            <div class="loading-lines" aria-hidden="true">
              <span></span><span></span><span></span>
            </div>
          </div>
        </main>
      </div>

      <nav class="mobile-nav" aria-label="Mobile navigation">
        <a href="/" data-nav data-route="overview">Overview</a>
        <a href="/products" data-nav data-route="products">Products</a>
        <a href="/competitors" data-nav data-route="competitors">Competitors</a>
        <a href="/alerts" data-nav data-route="alerts">Alerts</a>
      </nav>
    </div>

    <dialog class="workspace-dialog" id="workspace-dialog" aria-labelledby="workspace-dialog-title">
      <div id="workspace-dialog-content"></div>
    </dialog>

    <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
    <noscript>
      <div class="noscript">Price Monitor needs JavaScript for its operational workspace.</div>
    </noscript>
  </body>
</html>
